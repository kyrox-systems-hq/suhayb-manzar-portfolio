name: Deploy outreach mock-ups

on:
  push:
    branches:
      - agent/weekly-outreach-system
    paths:
      - 'public/mockups/.deploy-ready'

concurrency:
  group: firebase-outreach-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, outreach]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Firebase CLI
        shell: powershell
        run: |
          $firebase = Join-Path $env:RUNNER_TEMP 'firebase.exe'
          Invoke-WebRequest -Uri 'https://firebase.tools/bin/win/instant/latest' -OutFile $firebase
          "FIREBASE_EXE=$firebase" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy Firebase Hosting live
        shell: powershell
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_TOKEN }}'
        run: '& $env:FIREBASE_EXE deploy --only hosting --project suhayb-manzar-portfolio --non-interactive'
