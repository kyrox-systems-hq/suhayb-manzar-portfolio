name: Deploy outreach mock-ups

on:
  push:
    branches:
      - agent/weekly-outreach-system
    paths:
      - 'public/mockups/.deploy-ready'

concurrency:
  group: firebase-outreach-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firebase Hosting live
        env:
          FIREBASE_TOKEN: '${{ secrets.FIREBASE_TOKEN }}'
        run: firebase deploy --only hosting --project suhayb-manzar-portfolio --non-interactive
