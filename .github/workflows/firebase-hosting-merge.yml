name: Deploy portfolio to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-merge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy live channel
        id: firebase_deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUHAYB_MANZAR_PORTFOLIO }}"
          projectId: suhayb-manzar-portfolio
          channelId: live

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.firebase_deploy.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          printf 'status=%s\nsource_commit=%s\nworkflow_run=%s\n' "$DEPLOY_OUTCOME" "$SOURCE_COMMIT" "$GITHUB_RUN_ID" > firebase-deployment-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-deployment-status.txt
          git commit -m "ci: record Firebase deployment result" || exit 0
          git push

      - name: Fail workflow when deployment fails
        if: steps.firebase_deploy.outcome != 'success'
        run: exit 1
