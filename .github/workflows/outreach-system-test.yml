name: Outreach system tests

on:
  push:
    branches:
      - agent/weekly-outreach-system
  pull_request:
    paths:
      - 'outreach/**'
      - 'scripts/outreach*.mjs'
      - 'scripts/test-outreach-system-v2.mjs'
      - 'package.json'
      - '.github/workflows/outreach-system-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run outreach regression suite
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          node scripts/test-outreach-system-v2.mjs > outreach-test.log 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-test-diagnostics
          path: outreach-test.log
          if-no-files-found: warn
          retention-days: 1
      - name: Report test result
        if: always()
        shell: bash
        run: |
          cat outreach-test.log || true
          if [ "${{ steps.regression.outcome }}" != "success" ]; then
            exit 1
          fi
