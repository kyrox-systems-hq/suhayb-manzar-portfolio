name: Outreach system tests

on:
  push:
    branches:
      - agent/weekly-outreach-system
    paths-ignore:
      - 'outreach/ci-test-result.txt'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Run outreach regression suite
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/test-outreach-system-v2.mjs > outreach/ci-test-result.txt 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> outreach/ci-test-result.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outreach/ci-test-result.txt
          git commit -m "Record outreach regression result [skip ci]" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:agent/weekly-outreach-system
      - name: Fail when regression suite fails
        if: steps.regression.outputs.status != '0'
        run: exit 1
