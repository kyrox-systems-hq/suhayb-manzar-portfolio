name: Outreach system tests

on:
  push:
    branches:
      - agent/weekly-outreach-system
  pull_request:
    paths:
      - 'outreach/**'
      - 'scripts/outreach*.mjs'
      - 'scripts/test-outreach-system.mjs'
      - 'package.json'
      - '.github/workflows/outreach-system-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run adversarial outreach tests
        run: node scripts/test-outreach-system.mjs
