name: Outreach system tests

on:
  push:
    branches:
      - agent/weekly-outreach-system
  pull_request:
    paths:
      - 'outreach/**'
      - 'scripts/outreach*.mjs'
      - 'scripts/test-outreach-system-v2.mjs'
      - 'package.json'
      - '.github/workflows/outreach-system-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        shell: bash
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Runtime
        shell: bash
        run: |
          node --version
          npm --version
      - name: Run outreach regression suite
        shell: bash
        run: node scripts/test-outreach-system-v2.mjs
