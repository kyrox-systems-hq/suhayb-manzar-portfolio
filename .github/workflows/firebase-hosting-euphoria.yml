name: Deploy Euphoria mockup to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "public/mockups/euphoria-smoke-shop/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting-euphoria.yml"

permissions:
  contents: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Deploy live Firebase Hosting site
        id: firebase_deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUHAYB_MANZAR_PORTFOLIO }}"
          projectId: suhayb-manzar-portfolio
          channelId: live

      - name: Record Firebase deployment receipt
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.firebase_deploy.outcome }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          printf 'status=%s\nsource_commit=%s\nworkflow_run=%s\n' "$DEPLOY_OUTCOME" "$SOURCE_COMMIT" "$WORKFLOW_RUN" > firebase-euphoria-deployment-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-euphoria-deployment-status.txt
          git commit -m "ci: record Euphoria Firebase deployment" || exit 0
          git push

      - name: Fail when Firebase deployment fails
        if: steps.firebase_deploy.outcome != 'success'
        run: exit 1
