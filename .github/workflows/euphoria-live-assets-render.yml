name: Euphoria live assets render

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Build mock-up from live Euphoria assets
        run: python .github/scripts/euphoria_live_assets_render.py

      - name: Upload mock-up files
        uses: actions/upload-artifact@v4
        with:
          name: euphoria-live-assets-mockup
          path: |
            mockup-output/
            euphoria-live-assets-mockup.zip
          if-no-files-found: error
          retention-days: 2
